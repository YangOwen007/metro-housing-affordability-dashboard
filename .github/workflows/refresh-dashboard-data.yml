name: Refresh Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 13:00 UTC so the portfolio dataset stays fresh automatically.
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Refresh Census ACS dataset
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:refresh:ci

      - name: Commit refreshed dataset files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/acs data/processed/housing_dashboard_sample.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh dashboard ACS data"
          git push
