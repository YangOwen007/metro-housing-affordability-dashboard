name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_SOURCE_MODE: file
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: pnpm security:scan
      - run: pnpm build
      - run: pnpm security:scan --build
      - name: Production smoke test
        run: |
          pnpm start > /tmp/dashboard-start.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:3000/api/health && break
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/api/dashboard > /tmp/dashboard.json
          curl --fail --silent http://localhost:3000/ > /tmp/dashboard.html
  security:
    # Keep this gate visible; unresolved advisories must not prevent build evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm audit --audit-level high
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dashboard_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: dashboard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dashboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable runner credentials, not a deployed database or reusable secret.
      DATABASE_URL: postgresql://dashboard_test:disposable_ci_password@localhost:5432/dashboard_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:database
